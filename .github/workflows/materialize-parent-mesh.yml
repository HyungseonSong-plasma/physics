name: Materialize exact public Parent Mesh
on:
  push:
    branches: [assets/parent-mesh]
    paths: ['.github/workflows/materialize-parent-mesh.yml']
permissions:
  contents: read
jobs:
  mesh:
    if: ${{ github.repository_id == '1474679185' && github.actor_id == '189476866' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned historical geometry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HyungseonSong-plasma/moose-test-repo
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          persist-credentials: false
      - name: Generate and verify only the canonical graded L1 mesh
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 29d1acc6ef7969908b86719e4b95c73a1565136d
          python3 -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1
          BASE=experiments/fem_fvm_plasma_discriminator
          DIEL=experiments/Issue3_dielectric_surface_charge
          CHEM=experiments/Issue395_powered_chemistry_ladder
          mesh="$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          python3 "$BASE/generate_contour_mesh.py"
          python3 "$DIEL/extend_cover_mesh.py" "$BASE/plasma_contour_l3_4p5mm.msh" "$DIEL/baseline_cover_fine_source.msh"
          python3 "$DIEL/build_unstructured_cover_wafer_mesh.py" "$DIEL/baseline_cover_fine_source.msh" "$mesh"
          python3 "$DIEL/add_focus_ring_block.py" "$mesh" "$mesh"
          python3 "$DIEL/add_vacuum_coils_block.py" "$mesh" "$mesh"
          mkdir -p "$RUNNER_TEMP/parent-mesh"
          out="$RUNNER_TEMP/parent-mesh/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          python3 "$CHEM/issue397_materialize_l1_baseline.py" "$mesh" "$out"
          python3 "$CHEM/issue397_materialize_l1_baseline.py" --verify-existing "$out"
          echo "ac70642df75bf7b4bc4ec0d92511e545f0942f9e07a1361618fb9eb5696b83fc  $out" | sha256sum --check -
          wc -c "$out"
          # The mesh is public, bounded ASCII data. Export exact bytes for
          # connector-side Git blob creation without giving CI write access.
          test "$(wc -c < "$out")" -lt 1000000
          base64 -w 180 "$out" | sed 's/^/PARENT_MESH_B64:/'
          echo PARENT_MESH_EXPORT_PASS
      - name: Upload exact verified mesh
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-parent-mesh
          path: ${{ runner.temp }}/parent-mesh/
          if-no-files-found: error
          retention-days: 30
