name: Physics separate conformal meshes 100us
run-name: Physics native CI / ${{ github.ref_name }} / ${{ github.sha }}
on:
  push:
    branches: [test/separate-mesh-100us]
    paths: ['app/**', 'assets/**', 'tests/**', 'build-base/**', 'IMPORT_MANIFEST.json', '.github/workflows/physics-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framework-contract:
    permissions:
      contents: read
    uses: HyungseonSong-plasma/work/.github/workflows/reusable_test.yml@1f12e2621fa1c2b55c00ba8e5a8e5975d9f08b9f
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      BASE_IMAGE: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate initial import and dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/physics-evidence"
          python3 - <<'PY'
          import json, pathlib, subprocess, os
          m = json.loads(pathlib.Path("IMPORT_MANIFEST.json").read_text())
          expected = {e["path"]:(e["mode"],e["blob"]) for e in m["included"] if e["path"].startswith("app/")}
          current = {}
          for line in subprocess.check_output(["git","ls-tree","-rz","HEAD","app"]).split(b"\0"):
              if not line: continue
              meta,p = line.split(b"\t",1)
              mode,typ,sha = meta.decode().split()
              assert typ == "blob"
              current[p.decode()] = (mode,sha)
          # Initial snapshot integrity is evidence, not a permanent source freeze:
          # later reviewed source changes require explicit manifest update.
          assert current == expected, "Source differs from reviewed import manifest"
          import hashlib
          def blob(p): return subprocess.check_output(["git","rev-parse","HEAD:"+p],text=True).strip()
          for e in m["included"]:
              if e["path"].startswith("assets/"): assert blob(e["path"])==e["blob"],e["path"]
          for e in m["additional_assets"]:
              if e["path"]=="assets/maxwell.msh": continue  # historical source; now unified
              expected_blob=e["blob"]
              assert blob(e["path"])==expected_blob,e["path"]
          for p,digest in m["unified_mesh"]["files"].items():
              if p=="input.i":
                  assert blob("assets/input.i")==m["exodus_output"]["parent_input_blob"],p
              else:
                  assert hashlib.sha256(pathlib.Path("assets",p).read_bytes()).hexdigest()==digest,p
          for p in ("physics_app","runtime-image","database","assets/database","assets/chemistry","app/database","assets/maxwell.msh"):
              assert not pathlib.Path(p).exists(),p
          assert blob("assets/mesh.msh")==m["unified_mesh"]["candidate_blob"]
          assert hashlib.sha256(pathlib.Path("assets/mesh.msh").read_bytes()).hexdigest()==m["unified_mesh"]["mesh_sha256"]
          print("FLAT_ASSET_IDENTITY_PASS")
          expected_lock = dict(MOOSE="9f388366ccf38b9c34542ec5561198249fde0ac9",
              CRANE="ba26970cf419dcac563a20ed7079d445bc6341c3",
              SQUIRREL="16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1",
              ZAPDOS="9eceffbc46048c3760bbfa9a7f1ca681ae35af1d",
              PHYSICS_BUILD_BASE_IMAGE="ghcr.io/hyungseonsong-plasma/physics-build-base",
              PHYSICS_BUILD_BASE=os.environ["BASE_IMAGE"])
          records = [line.split("=",1) for line in pathlib.Path("app/dependencies.lock").read_text().splitlines() if line and not line.startswith("#")]
          assert len(records) == len(expected_lock) and dict(records) == expected_lock
          print("IMPORT_PATH_MODE_BLOB_PASS",len(current))
          print("DEPENDENCY_LOCK_PASS")
          PY
          { git rev-parse HEAD; git rev-parse HEAD:app; sha256sum IMPORT_MANIFEST.json app/dependencies.lock; df -h /; } | tee "$RUNNER_TEMP/physics-evidence/provenance.txt"
      - name: Pull and verify immutable dependency base
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          test "$(docker image inspect "$BASE_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          test "$(docker image inspect "$BASE_IMAGE" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "9f388366ccf38b9c34542ec5561198249fde0ac9"
          test "$(docker image inspect "$BASE_IMAGE" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "ba26970cf419dcac563a20ed7079d445bc6341c3"
          test "$(docker image inspect "$BASE_IMAGE" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1"
          test "$(docker image inspect "$BASE_IMAGE" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "9eceffbc46048c3760bbfa9a7f1ca681ae35af1d"
          { echo "$BASE_IMAGE"; docker image inspect "$BASE_IMAGE" --format '{{.Id}} {{.Size}}'; df -h /; } | tee -a "$RUNNER_TEMP/physics-evidence/provenance.txt"
      - name: Compile Physics and verify native smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 --workdir /workspace/app \
            -e GITHUB_SHA="$GITHUB_SHA" -v "$PWD:/workspace" -v "$RUNNER_TEMP/physics-evidence:/evidence" \
            "$BASE_IMAGE" -lc '
              set -euo pipefail
              source /environment
              for p in /workspace /opt/physics_vendor/{moose,crane,squirrel,zapdos}; do git config --global --add safe.directory "$p"; done
              test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
              export MOOSE_DIR=/opt/physics_vendor/moose CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
              for pair in "moose:9f388366ccf38b9c34542ec5561198249fde0ac9" "crane:ba26970cf419dcac563a20ed7079d445bc6341c3" "squirrel:16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1" "zapdos:9eceffbc46048c3760bbfa9a7f1ca681ae35af1d"; do
                test "$(git -C "/opt/physics_vendor/${pair%%:*}" rev-parse HEAD)" = "${pair#*:}"
              done
              for lib in crane squirrel zapdos; do test -e "/opt/physics_vendor/$lib/lib/lib$lib-opt.la"; done
              cat /opt/physics-build-base/BUILD_BASE_PROVENANCE.txt
              test ! -e physics-opt
              c++ --version | head -1
              date -u
              make -j2 app_non_unity_dirs="%/utils" 2>&1 | tee /evidence/build.log
              test -x physics-opt
              sha256sum physics-opt | tee /evidence/executable.sha256
              export LD_LIBRARY_PATH="$PWD/test/lib:$PWD/lib:${LD_LIBRARY_PATH:-}"
              ldd ./physics-opt | tee /evidence/ldd.txt
              if grep -q "not found" /evidence/ldd.txt; then exit 1; fi
              timeout 180 ./physics-opt --check-input -i ci/smoke.i 2>&1 | tee /evidence/check-input.log
              timeout 180 ./physics-opt -i ci/smoke.i 2>&1 | tee /evidence/steady.log
              timeout 180 ./physics-opt --check-input -i ci/species_wall_functor_naming_smoke.i 2>&1 | tee /evidence/app-construction.log
              sed "s/type = Diffusion/type = InvalidPhysicsPilotObject/" ci/smoke.i >/tmp/physics-invalid.i
              set +e
              timeout 180 ./physics-opt --check-input -i /tmp/physics-invalid.i >/evidence/negative.log 2>&1
              rc=$?
              set -e
              test "$rc" -ne 0 && test "$rc" -ne 124
              grep -q InvalidPhysicsPilotObject /evidence/negative.log
              echo PHYSICS_NATIVE_BUILD_AND_SMOKE_PASS
              date -u
            '
      - name: Stage pinned separate conformal meshes and run 400 W to 100us
        shell: bash
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/physics-evidence"
          case_dir="$RUNNER_TEMP/separate-case"
          mkdir -p "$case_dir" "$ev/fields"
          cp -a assets "$case_dir/assets"
          old=95949734dc6954108d87deb5ed6e2f750bd990b7
          for file in mesh.msh maxwell.msh input.i maxwell.i; do
            git show "$old:assets/$file" > "$case_dir/assets/$file"
          done
          test "$(git hash-object "$case_dir/assets/mesh.msh")" = 1674286d95b5031651c74c0ff38667626d5549f5
          test "$(git hash-object "$case_dir/assets/maxwell.msh")" = da8af4354d7cef5552bc7efccf3baf0da7d564bd
          grep -Fq "end_time = 1e-4" "$case_dir/assets/input.i"
          grep -Fq "target = 400" "$case_dir/assets/input.i"
          grep -Fq "cli_args = 'Outputs/exodus=false;Outputs/csv=false'" "$case_dir/assets/input.i"
          sed -i "s/Outputs\/exodus=false;Outputs\/csv=false/Outputs\/exodus=true;Outputs\/csv=false/" "$case_dir/assets/input.i"
          { echo "separate conformal source=$old"; git rev-parse HEAD; (cd "$case_dir/assets" && sha256sum mesh.msh maxwell.msh input.i maxwell.i chemistry.json); } | tee "$ev/case-provenance.txt"
          opts=(--network none --workdir /case --entrypoint /bin/bash --user 0:0
            --env OXYGEN_RESEARCH_400=1 --env OXYGEN_RESEARCH_FULL24=0 --env OXYGEN_RESEARCH_EI2738_FORMULA=0 --env OXYGEN_RESEARCH_QUICK_5MIN=0
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" -v "$case_dir:/case" -v "$ev:/evidence")
          args=(-i assets/input.i Executioner/end_time=1e-4 Outputs/file_base=/evidence/fields/parent Outputs/exodus=true Outputs/csv=true Outputs/time_step_interval=1 'Outputs/execute_on=INITIAL TIMESTEP_END' Outputs/checkpoint=false)
          timeout 480 docker run --rm "${opts[@]}" "$BASE_IMAGE" -lc '
            set -euo pipefail
            source /environment
            export LD_LIBRARY_PATH=/workspace/app/test/lib:/workspace/app/lib:${LD_LIBRARY_PATH:-}
            exec /workspace/app/physics-opt --check-input "$@"
          ' physics-opt "${args[@]}" 2>&1 | tee "$ev/separate-check-input.log"
          grep -q 'Syntax OK' "$ev/separate-check-input.log"
          timeout 17400 docker run --rm "${opts[@]}" "$BASE_IMAGE" -lc '
            set -euo pipefail
            source /environment
            export LD_LIBRARY_PATH=/workspace/app/test/lib:/workspace/app/lib:${LD_LIBRARY_PATH:-}
            exec /workspace/app/physics-opt "$@"
          ' physics-opt "${args[@]}" 2>&1 | tee "$ev/separate-100us.log"
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 -v "$ev:/evidence" -v "$PWD/tests/mesh:/scripts:ro" "$BASE_IMAGE" -lc '
            source /environment
            python3 - <<'"'"'PY'"'"'
          import sys, json, pathlib
          sys.path.insert(0, "/scripts")
          from importlib import import_module
          v = import_module("verify-flat")
          p = pathlib.Path("/evidence/fields")
          target = 1e-4
          children = sorted(p.glob("parent*maxwell_t6*.e"))
          assert children, "Maxwell Exodus missing"
          result = dict(endpoint_s=target, density_extrema=v.endpoint(p/"parent.csv", target),
                        spatial_log_field_counts=v.exodus(p/"parent.e", target),
                        maxwell_files=[x.name for x in children], science="SCIENCE_HOLD")
          (p/"manifest.json").write_text(json.dumps(result, indent=2)+"\n")
          print(json.dumps(result))
          PY
          '
      - name: Upload separate mesh evidence and available results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physics-separate-mesh-400W-100us
          path: ${{ runner.temp }}/physics-evidence/
          if-no-files-found: warn
          retention-days: 30
