name: New-only S6-417 public runtime pilot
on:
  push:
    branches: [test/newonly-417-runtime]
    paths: ['.github/workflows/newonly-417-runtime.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: ${{ github.repository_id == '1474679185' && github.actor_id == '189476866' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_HEAD: f55bd9fe32023f21a4c2d0c571b51e9e077f5475
      BASE_IMAGE: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate initial import and dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/physics-evidence"
          python3 - <<'PY'
          import json, pathlib, subprocess, os
          m = json.loads(pathlib.Path("IMPORT_MANIFEST.json").read_text())
          expected = {e["path"]:(e["mode"],e["blob"]) for e in m["included"]}
          current = {}
          for line in subprocess.check_output(["git","ls-tree","-rz","HEAD","physics_app"]).split(b"\0"):
              if not line: continue
              meta,p = line.split(b"\t",1)
              mode,typ,sha = meta.decode().split()
              assert typ == "blob"
              current[p.decode()] = (mode,sha)
          # Initial snapshot integrity is evidence, not a permanent source freeze:
          # later reviewed source changes require explicit manifest update.
          assert current == expected, "Source differs from reviewed import manifest"
          expected_lock = dict(MOOSE="9f388366ccf38b9c34542ec5561198249fde0ac9",
              CRANE="ba26970cf419dcac563a20ed7079d445bc6341c3",
              SQUIRREL="16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1",
              ZAPDOS="9eceffbc46048c3760bbfa9a7f1ca681ae35af1d",
              PHYSICS_BUILD_BASE_IMAGE="ghcr.io/hyungseonsong-plasma/physics-build-base",
              PHYSICS_BUILD_BASE=os.environ["BASE_IMAGE"])
          records = [line.split("=",1) for line in pathlib.Path("physics_app/dependencies.lock").read_text().splitlines() if line and not line.startswith("#")]
          assert len(records) == len(expected_lock) and dict(records) == expected_lock
          print("IMPORT_PATH_MODE_BLOB_PASS",len(current))
          print("DEPENDENCY_LOCK_PASS")
          PY
          { git rev-parse HEAD; git rev-parse HEAD:physics_app; sha256sum IMPORT_MANIFEST.json physics_app/dependencies.lock; df -h /; } | tee "$RUNNER_TEMP/physics-evidence/provenance.txt"
      - name: Checkout exact public experiment source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HyungseonSong-plasma/moose-test-repo
          ref: f55bd9fe32023f21a4c2d0c571b51e9e077f5475
          path: upstream
          persist-credentials: false
      - name: Verify public source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$BASE_HEAD"
          test ! -e upstream/experiments/Issue395_powered_chemistry_ladder/private_rates
          test ! -e upstream/physics_app/physics-opt
      - name: Download exact verified 417 941 P3-X public source and immutable diagnostic staging helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-in"
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/HyungseonSong-plasma/moose-test-repo/actions/artifacts/14406746397/zip" \
            --output "$RUNNER_TEMP/p05-in/p3x-source.zip"
          echo "592a7c82834bab841f6a2e1807db305d0eff1e953f50a0dcc6d7e21ff8820111  $RUNNER_TEMP/p05-in/p3x-source.zip" | sha256sum --check -
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/HyungseonSong-plasma/moose-test-repo/41ab61e442a497db2388c025075237bd24cfd025/ci/issue671_p5_d8_native_probe.py" \
            --output "$RUNNER_TEMP/p05-in/pinned_source_stager.py"
          test "$(git hash-object "$RUNNER_TEMP/p05-in/pinned_source_stager.py")" = 8bf49b7807c9f9b3eed8e622e72062f2b5c822bc
          python3 -m py_compile "$RUNNER_TEMP/p05-in/pinned_source_stager.py"
          echo P05_PUBLIC_ARTIFACT_AND_STAGER_PIN_PASS
      - name: Checkout immutable historical public S6 mesh and support source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HyungseonSong-plasma/moose-test-repo
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
          persist-credentials: false
      - name: Reproduce exact SHA-pinned 400 W public parent plasma mesh
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          python3 -m pip install --disable-pip-version-check --quiet \
            'pytest>=8,<9' 'pydantic>=2,<3' numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2 \
            -r requirements-evidence-engine.txt -r requirements-ontology.txt
          cd ../historical
          SRC=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          DST=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          echo "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  $SRC" | sha256sum --check -
          cp "$SRC" "$DST"
          export CHATGPT_WORK_BASE_SHA=29d1acc6ef7969908b86719e4b95c73a1565136d
          export OXYGEN_RESEARCH_400=1
          CHEM=experiments/Issue395_powered_chemistry_ladder
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          echo "ac70642df75bf7b4bc4ec0d92511e545f0942f9e07a1361618fb9eb5696b83fc  $CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" | sha256sum --check -
          test ! -e "$CHEM/private_rates"
          echo P05_PUBLIC_MESH_SHA_PASS
      - name: Stage real eleven-layer inputs with original mesh and support; exact P4-X owner cutover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-in/staged"
          python3 "$RUNNER_TEMP/p05-in/pinned_source_stager.py" \
            --source "$GITHUB_WORKSPACE/upstream" --repo-head "$BASE_HEAD" \
            --artifact "$RUNNER_TEMP/p05-in/p3x-source.zip" \
            --historical-mesh "$GITHUB_WORKSPACE/historical/experiments/Issue395_powered_chemistry_ladder/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            --historical-support-root "$GITHUB_WORKSPACE/historical" \
            --output "$RUNNER_TEMP/p05-in/staged" --stage-only
          python3 - "$RUNNER_TEMP/p05-in/staged" "$GITHUB_WORKSPACE/upstream" "$RUNNER_TEMP/p05-in/p4_receipt.json" <<'PY'
          from pathlib import Path
          import sys,json,hashlib
          stage=Path(sys.argv[1]); root=Path(sys.argv[2]); out=Path(sys.argv[3])
          sys.path.insert(0,str(root/"experiments/Issue402_plasma_dsl_g1/chemistry"))
          from retire_s6_p4_duplicate_owners import retire_p4_duplicate_owners, C0, AFTER_SHA
          stages=json.loads((stage/"readiness.json").read_text())["stage_cases"]
          receipts={}
          for case in ("417","941"):
              folder=stage/"scratch"/case/"experiments"/"Issue395_powered_chemistry_ladder"
              raw_ordered=stages[case]["ordered"]
              ordered=[Path(p).name for p in raw_ordered]
              assert len(ordered)==11 and ordered[0]==C0 and len(set(ordered))==11
              sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
              baseline={n:sha(folder/n) for n in ordered}
              marker=folder/".issue633_disposable_scratch"
              assert not marker.is_symlink()
              if marker.exists():
                  assert marker.read_text().strip()=="issue633-scratch-only"
              else:
                  marker.write_text("issue633-scratch-only\n")
              js=json.loads((folder/"chemistry"/f"unified_s6_{case}_newonly.json").read_text())
              cut=retire_p4_duplicate_owners(folder,ordered,js,post_p3_layer_sha=baseline)
              assert sha(folder/C0)==AFTER_SHA
              assert all(sha(folder/n)==baseline[n] for n in ordered[1:])
              assert cut["retired_source_materials"]==6 and cut["carrier_one_preserved"]
              receipts[case]={"P4X":"P4X_7_OWNER_SOURCE_PASS","post_p4_C0_sha256":sha(folder/C0),
                              "retired_old_ion_FV":26,"retired_old_electron":10,
                              "retired_old_duplicate_materials":6,"carrier_one_preserved":True,
                              "ordered_inputs":raw_ordered,
                              "11_layer_sha256":{n:sha(folder/n) for n in ordered},
                              "JSON_sha256":sha(folder/"chemistry"/f"unified_s6_{case}_newonly.json"),
                              "parent_mesh_sha256":sha(folder/"baseline_plasma_plus_unstructured_cover_plus_wafer.msh")}
          out.write_text(json.dumps(receipts,indent=2,sort_keys=True)+"\n")
          print("P05_REAL_POST_P4X_STAGE_BOTH_CASES_11_LAYER_PASS")
          PY
      - name: Verify merged source SHA and convert real 417/941 Public D original100 disposable cases
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          test "$(git hash-object experiments/Issue402_plasma_dsl_g1/chemistry/prepare_public_d_newphysics_100row.py)" = 2af269364a6535cc44145783e27c14abed0bc365
          echo "994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387  physics_app/database/electron_moments.txt" | sha256sum -c -
          python3 -m py_compile experiments/Issue402_plasma_dsl_g1/chemistry/prepare_public_d_newphysics_100row.py
          python3 - "$RUNNER_TEMP/p05-in/p4_receipt.json" "$RUNNER_TEMP/p05-in/staged" "$GITHUB_WORKSPACE/upstream" "$RUNNER_TEMP/p05-out" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          receipt_path,staged,repo,out=map(Path,sys.argv[1:])
          sys.path.insert(0,str(repo/"experiments/Issue402_plasma_dsl_g1/chemistry"))
          from prepare_public_d_newphysics_100row import stage_public_d_physics
          original=repo/"physics_app/database/electron_moments.txt"
          expected="994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387"
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(original)==expected and len(original.read_bytes().splitlines())==100
          p4=json.loads(receipt_path.read_text())
          out.mkdir(parents=True,exist_ok=True)
          for case in ("417","941"):
              folder=staged/"scratch"/case/"experiments"/"Issue395_powered_chemistry_ladder"
              rec=stage_public_d_physics(folder,case,p4[case]["ordered_inputs"],original)
              assert rec["original_table_sha256"]==expected and rec["original_table_rows"]==100
              assert rec["expected_physics_ion_kernel_count"]==12
              assert rec["expected_physics_ion_bc_count"]==12
              assert rec["expected_electron_sheath_bc_count"]==8
              assert rec["chemistry_reaction_count"]==8 and rec["history_compat_runner"]=="NOT_CREATED"
              p4[case]["11_layer_sha256"]=rec["staged_11layer_sha256"]
              p4[case]["JSON_sha256"]=rec["json_sha256"]
              p4[case]["original_table_sha256"]=expected
              p4[case]["original_table_rows"]=100
              (out/f"public-d-{case}.json").write_text(json.dumps(rec,sort_keys=True,indent=2)+"\n")
              print("PUBLIC_D_ORIGINAL100_SOURCE_BC12_E8_STAGE_PASS",case)
          assert sha(original)==expected and len(original.read_bytes().splitlines())==100
          receipt_path.write_text(json.dumps(p4,sort_keys=True,indent=2)+"\n")
          assert json.loads(receipt_path.read_text())==p4
          PY
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          echo PUBLIC_D_100ROW_TWO_CASES_STAGED_EXACT_PHYSICS_NO_REBUILD_PASS
      - name: Pull and verify immutable dependency base
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          test "$(docker image inspect "$BASE_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          test "$(docker image inspect "$BASE_IMAGE" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "9f388366ccf38b9c34542ec5561198249fde0ac9"
          test "$(docker image inspect "$BASE_IMAGE" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "ba26970cf419dcac563a20ed7079d445bc6341c3"
          test "$(docker image inspect "$BASE_IMAGE" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1"
          test "$(docker image inspect "$BASE_IMAGE" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "9eceffbc46048c3760bbfa9a7f1ca681ae35af1d"
          { echo "$BASE_IMAGE"; docker image inspect "$BASE_IMAGE" --format '{{.Id}} {{.Size}}'; df -h /; } | tee -a "$RUNNER_TEMP/physics-evidence/provenance.txt"
      - name: Compile Physics and verify native smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 --workdir /workspace/physics_app \
            -e GITHUB_SHA="$GITHUB_SHA" -v "$PWD:/workspace" -v "$RUNNER_TEMP/physics-evidence:/evidence" \
            "$BASE_IMAGE" -lc '
              set -euo pipefail
              source /environment
              for p in /workspace /opt/physics_vendor/{moose,crane,squirrel,zapdos}; do git config --global --add safe.directory "$p"; done
              test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
              export MOOSE_DIR=/opt/physics_vendor/moose CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
              for pair in "moose:9f388366ccf38b9c34542ec5561198249fde0ac9" "crane:ba26970cf419dcac563a20ed7079d445bc6341c3" "squirrel:16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1" "zapdos:9eceffbc46048c3760bbfa9a7f1ca681ae35af1d"; do
                test "$(git -C "/opt/physics_vendor/${pair%%:*}" rev-parse HEAD)" = "${pair#*:}"
              done
              for lib in crane squirrel zapdos; do test -e "/opt/physics_vendor/$lib/lib/lib$lib-opt.la"; done
              cat /opt/physics-build-base/BUILD_BASE_PROVENANCE.txt
              test ! -e physics-opt
              c++ --version | head -1
              date -u
              make -j2 app_non_unity_dirs="%/utils" 2>&1 | tee /evidence/build.log
              test -x physics-opt
              sha256sum physics-opt | tee /evidence/executable.sha256
              export LD_LIBRARY_PATH="$PWD/test/lib:$PWD/lib:${LD_LIBRARY_PATH:-}"
              ldd ./physics-opt | tee /evidence/ldd.txt
              if grep -q "not found" /evidence/ldd.txt; then exit 1; fi
              timeout 180 ./physics-opt --check-input -i ci/smoke.i 2>&1 | tee /evidence/check-input.log
              timeout 180 ./physics-opt -i ci/smoke.i 2>&1 | tee /evidence/steady.log
              timeout 180 ./physics-opt --check-input -i ci/species_wall_functor_naming_smoke.i 2>&1 | tee /evidence/app-construction.log
              sed "s/type = Diffusion/type = InvalidPhysicsPilotObject/" ci/smoke.i >/tmp/physics-invalid.i
              set +e
              timeout 180 ./physics-opt --check-input -i /tmp/physics-invalid.i >/evidence/negative.log 2>&1
              rc=$?
              set -e
              test "$rc" -ne 0 && test "$rc" -ne 124
              grep -q InvalidPhysicsPilotObject /evidence/negative.log
              echo PHYSICS_NATIVE_BUILD_AND_SMOKE_PASS
              date -u
            '
      - name: Collect runtime closure and native database baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir runtime-image/runtime-root
          ev="$RUNNER_TEMP/physics-evidence"
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 \
            -v "$PWD/physics_app:/opt/physics:ro" \
            -v "$PWD/runtime-image/collect-runtime.sh:/usr/local/bin/collect-runtime:ro" \
            -v "$PWD/runtime-image/database-smoke.i:/database-smoke.i:ro" \
            -v "$PWD/runtime-image/runtime-root:/runtime-root" \
            -v "$ev:/evidence" "$BASE_IMAGE" -lc '
              set -euo pipefail
              source /environment
              export LD_LIBRARY_PATH="/opt/physics/test/lib:/opt/physics/lib:${LD_LIBRARY_PATH:-}"
              timeout 180 /opt/physics/physics-opt -i /database-smoke.i Outputs/file_base=/evidence/native-db 2>&1 | tee /evidence/native-db.log
              bash /usr/local/bin/collect-runtime /runtime-root
            '
          sudo cp runtime-image/database-smoke.i runtime-image/runtime-root/opt/physics/ci/runtime-database-smoke.i
          sudo cp UPSTREAM_NOTICES.md runtime-image/runtime-root/opt/physics/UPSTREAM_NOTICES.md
          sudo cp IMPORT_MANIFEST.json runtime-image/runtime-root/opt/physics/IMPORT_MANIFEST.json
          sudo cp runtime-image/runtime-root/opt/physics/RUNTIME_CLOSURE.txt "$ev/"
          {
            echo "PHYSICS_REPOSITORY=$GITHUB_REPOSITORY"
            echo "PHYSICS_REVISION=$GITHUB_SHA"
            echo "UPSTREAM_PR903=f55bd9fe32023f21a4c2d0c571b51e9e077f5475"
            echo "BUILD_BASE=$BASE_IMAGE"
            echo "SOURCE_MANIFEST_SHA256=$(sha256sum IMPORT_MANIFEST.json | cut -d' ' -f1)"
            cat "$ev/executable.sha256"
          } | sudo tee runtime-image/runtime-root/opt/physics/RUNTIME_PROVENANCE.txt | tee "$ev/RUNTIME_PROVENANCE.txt"
          test -s "$ev/native-db.csv"
          df -h /
          docker image rm "$BASE_IMAGE" || true
      - name: Build local scratch runtime and verify isolated execution
        shell: bash
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/physics-evidence"
          image="physics-runtime:ci-$GITHUB_SHA"
          manifest="$(sha256sum IMPORT_MANIFEST.json | cut -d' ' -f1)"
          docker build --network none --platform linux/amd64 \
            --build-arg BUILD_BASE_REF="$BASE_IMAGE" \
            --build-arg REPOSITORY_SHA="$GITHUB_SHA" \
            --build-arg PHYSICS_SOURCE_MANIFEST_SHA256="$manifest" \
            -t "$image" runtime-image
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.physics.source.manifest-sha256" }}')" = "$manifest"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.physics.source.owner" }}')" = "physics/physics_app"
          docker image inspect "$image" --format '{{.Id}} {{.Size}} {{.Os}}/{{.Architecture}}' | tee "$ev/runtime-image.txt"
          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir "$RUNNER_TEMP/runtime-db" "$RUNNER_TEMP/installed-db"
          docker cp "$cid:/opt/physics/database/." "$RUNNER_TEMP/runtime-db"
          docker cp "$cid:/opt/share/physics/database/." "$RUNNER_TEMP/installed-db"
          docker cp "$cid:/opt/physics/physics-opt" "$RUNNER_TEMP/runtime-physics-opt"
          test "$(sha256sum "$RUNNER_TEMP/runtime-physics-opt" | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$ev/executable.sha256")"
          docker rm "$cid"
          trap - EXIT
          timeout 180 docker run --rm --network none "$image" --check-input -i /opt/physics/ci/smoke.i 2>&1 | tee "$ev/runtime-check-input.log"
          timeout 180 docker run --rm --network none "$image" -i /opt/physics/ci/smoke.i 2>&1 | tee "$ev/runtime-steady.log"
          timeout 180 docker run --rm --network none "$image" --check-input -i /opt/physics/ci/species_wall_functor_naming_smoke.i 2>&1 | tee "$ev/runtime-app-construction.log"
          timeout 180 docker run --rm --network none -v "$ev:/evidence" "$image" -i /opt/physics/ci/runtime-database-smoke.i Outputs/file_base=/evidence/runtime-db 2>&1 | tee "$ev/runtime-db.log"
          python3 runtime-image/verify-runtime.py "$RUNNER_TEMP/runtime-db" "$RUNNER_TEMP/installed-db" "$ev/native-db.csv" "$ev/runtime-db.csv" | tee "$ev/runtime-verification.txt"
          echo PHYSICS_ISOLATED_RUNTIME_PASS
      - name: Stage exact public EI candidate and run S6-417 in independent runtime
        shell: bash
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/physics-evidence"
          python3 - "$RUNNER_TEMP/p05-in" "$RUNNER_TEMP/newonly-417" "$ev" <<'PY'
          import hashlib, json, os, pathlib, sys
          inp,target,ev = map(pathlib.Path,sys.argv[1:])
          root = pathlib.Path.cwd()
          upstream = root/"upstream"
          sys.path.insert(0,str(upstream/"ci/guards"))
          from issue898_public_ei_candidate import stage_case,load_rates,load_transport_tables
          rates=load_rates(root)
          tables=load_transport_tables(root)
          p4=json.loads((inp/"p4_receipt.json").read_text())
          record=stage_case(inp/"staged/scratch/417",target,"417",p4["417"],rates,tables)
          assert not any(p.name=="private_rates" for p in target.rglob("*"))
          record["science"]="SCIENCE_HOLD"
          record["execution_scope"]="one parent timestep; original physical inputs and layer order"
          record["runtime_source_sha"]="fd8468c346ec219ca4acd127de4d578dfc252d93"
          (ev/"newonly-stage.json").write_text(json.dumps(record,indent=2)+"\n")
          print("NEWONLY_417_PUBLIC_STAGE_PASS")
          PY
          image="physics-runtime:ci-$GITHUB_SHA"
          mapfile -t layers < <(python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["ordered"]))' "$ev/newonly-stage.json")
          test "${#layers[@]}" -eq 11
          stage="$RUNNER_TEMP/newonly-417"
          cmd=(docker run --rm --network none --workdir /case
            --env OXYGEN_RESEARCH_400=1 --env OXYGEN_RESEARCH_FULL24=0
            --env OXYGEN_RESEARCH_EI2738_FORMULA=0 --env OXYGEN_RESEARCH_QUICK_5MIN=0
            --mount "type=bind,src=$stage,dst=/case"
            "$image")
          timeout 480 "${cmd[@]}" --check-input -i "${layers[@]}" 2>&1 | tee "$ev/newonly-check-input.log"
          grep -q 'Syntax OK' "$ev/newonly-check-input.log"
          echo NEWONLY_417_RUNTIME_CHECK_INPUT_PASS
          timeout 1800 "${cmd[@]}" -i "${layers[@]}" Executioner/num_steps=1 2>&1 | tee "$ev/newonly-one-step.log"
          grep -E 'Time Step 1|Time Step[[:space:]]+1' "$ev/newonly-one-step.log"
          grep -i 'Solve Converged' "$ev/newonly-one-step.log"
          echo NEWONLY_417_RUNTIME_ONE_STEP_EXECUTED
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: newonly-417-runtime-evidence
          path: ${{ runner.temp }}/physics-evidence/
          if-no-files-found: warn
          retention-days: 30
